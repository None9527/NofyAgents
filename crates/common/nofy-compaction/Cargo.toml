[package]
license = "Apache-2.0"
name = "nofy-compaction"
version = "0.1.0"
edition.workspace = true
description = "Shared, transport-agnostic compaction engine for Nofy chat and Nofy Build."

[features]
agent-runtime = ["dep:nofy-agent-runtime", "dep:nofy-token-estimation", "dep:serde_json", "dep:blake3"]

[dependencies]
nofy-agent-runtime = { path = "../nofy-agent-runtime", optional = true }
nofy-token-estimation = { path = "../nofy-token-estimation", optional = true }
serde_json = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
