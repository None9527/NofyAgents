[package]
name = "nofy-agent-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-independent agent execution, component contracts and composition"

[features]
default = []
control-file = ["dep:fs2"]
# Selects the declarative DAG modules; no separate script engine dependency.
workflow = []
sqlite = ["dep:rusqlite", "dep:nofy-sqlite-journal"]
pack = ["dep:nofy-packcore"]

[dependencies]
sha2 = { workspace = true }
nofy-durable-fs = { workspace = true }
fs2 = { workspace = true, optional = true }
rusqlite = { version = "0.37", features = ["bundled", "backup"], optional = true }
nofy-sqlite-journal = { path = "../nofy-sqlite-journal", optional = true }
nofy-packcore = { workspace = true, optional = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
nofy-tool-runtime = { path = "../nofy-tool-runtime" }
nofy-tool-types = { path = "../nofy-tool-types" }
nofy-tool-protocol = { path = "../nofy-tool-protocol" }
nofy-interjection-core = { path = "../nofy-interjection-core" }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
