[package]
name = "nofy-agent-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-independent agent execution, component contracts and composition"

[features]
default = []
control-file = ["dep:fs2"]
workflow = ["dep:nofy-workflow", "dep:nofy-orchestra"]
sqlite = ["dep:rusqlite", "dep:nofy-sqlite-journal"]
pack = ["dep:nofy-packcore"]

[dependencies]
sha2 = { workspace = true }
fs2 = { workspace = true, optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
nofy-sqlite-journal = { path = "../../codegen/nofy-sqlite-journal", optional = true }
nofy-packcore = { path = "../../codegen/nofy-packcore", optional = true }
nofy-workflow = { path = "../../codegen/nofy-workflow", optional = true }
nofy-orchestra = { path = "../../codegen/nofy-orchestra", optional = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
nofy-tool-runtime = { path = "../nofy-tool-runtime" }
nofy-tool-types = { path = "../nofy-tool-types" }
nofy-tool-protocol = { path = "../nofy-tool-protocol" }
nofy-interjection-core = { path = "../nofy-interjection-core" }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
