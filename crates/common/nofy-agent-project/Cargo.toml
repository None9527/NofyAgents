[package]
name = "nofy-agent-project"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure declarative source projects shared by the kernel, CLI and MCP"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
fs2 = { workspace = true }
tempfile = { workspace = true }
nofy-durable-fs = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
cap-std = "3.4"
libc = { workspace = true }
jsonschema = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
