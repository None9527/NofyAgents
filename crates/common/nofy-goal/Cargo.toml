[package]
name = "nofy-goal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical Goal lifecycle, snapshots and artifact handling"

[features]
test-support = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
