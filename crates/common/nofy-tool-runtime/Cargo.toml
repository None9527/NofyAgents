[package]
license = "Apache-2.0"
name = "nofy-tool-runtime"
version = "0.1.0"
edition.workspace = true
description = "Shared tool execution, dispatch, streaming, context, and search contracts"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
nofy-tool-protocol = { workspace = true }
nofy-tool-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
