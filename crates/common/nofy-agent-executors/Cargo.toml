[package]
name = "nofy-agent-executors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Explicit HTTP and process adapters for configurable agent tools"

[features]
default = []
rhai = ["dep:rhai"]
nofy-sandbox = ["dep:nofy-sandbox"]

[dependencies]
rhai = { workspace = true, optional = true }
nofy-agent-runtime = { path = "../nofy-agent-runtime" }
nofy-tool-runtime = { path = "../nofy-tool-runtime" }
nofy-tool-protocol = { path = "../nofy-tool-protocol" }
nofy-tool-types = { path = "../nofy-tool-types" }
nofy-tty-utils = { workspace = true }
nofy-sandbox = { path = "../../codegen/nofy-sandbox", default-features = false, optional = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "fs"] }
tokio-util = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
