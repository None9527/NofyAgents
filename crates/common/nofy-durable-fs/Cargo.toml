[package]
name = "nofy-durable-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The platform contract for making a file change survive a crash: durable replace, durable create-new, directory flush"

[dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }
