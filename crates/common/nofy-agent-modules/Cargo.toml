[package]
name = "nofy-agent-modules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Product-independent declarative prompt, skill and permission modules"

[dependencies]
nofy-agent-runtime = { path = "../nofy-agent-runtime" }
nofy-tool-runtime = { path = "../nofy-tool-runtime" }
nofy-tool-types = { path = "../nofy-tool-types" }
nofy-tool-protocol = { path = "../nofy-tool-protocol" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
minijinja = { version = "=2.18.0", features = ["custom_syntax", "fuel"] }
glob = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
rhai = { workspace = true }

[dev-dependencies]
nofy-agent-runtime = { path = "../nofy-agent-runtime", features = ["sqlite"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
