[package]
license = "Apache-2.0"
name = "nofy-memory"
version = "0.1.0"
edition.workspace = true

[features]
# Exposes `#[cfg(test)]`-only helpers (`MemoryStorage::with_paths`,
# `MockEmbeddingProvider`) to downstream crates' test targets.
test-support = []
agent-runtime = ["dep:nofy-agent-runtime", "dep:nofy-tool-runtime", "dep:nofy-tool-types", "dep:nofy-tool-protocol", "dep:futures"]

[dependencies]
nofy-agent-runtime = { path = "../../common/nofy-agent-runtime", optional = true }
nofy-tool-runtime = { path = "../../common/nofy-tool-runtime", optional = true }
nofy-tool-types = { path = "../../common/nofy-tool-types", optional = true }
nofy-tool-protocol = { path = "../../common/nofy-tool-protocol", optional = true }
futures = { workspace = true, optional = true }
nofy-env = { workspace = true }
age = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dunce = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
keyring = { workspace = true }
notify = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { workspace = true }
serde = { workspace = true }
tar = { workspace = true }
# sqlite-vec: vec0 virtual table for KNN vector search.
sqlite-vec = "=0.1.7-alpha.2"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
nofy-auth = { workspace = true }
nofy-config-types = { workspace = true }
nofy-http = { workspace = true }
nofy-telemetry = { workspace = true }
nofy-tools = { workspace = true }
nofy-version = { workspace = true }
nofy-sqlite-journal = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
nofy-compaction = { path = "../../common/nofy-compaction", features = ["agent-runtime"] }
nofy-agent-runtime = { path = "../../common/nofy-agent-runtime", features = ["sqlite"] }
filetime = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
