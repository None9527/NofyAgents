[package]
license = "Apache-2.0"
name = "nofy-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
nofy-auth = { workspace = true, features = ["middleware"] }
nofy-extra-ca = { workspace = true }
nofy-sampler = { path = "../nofy-sampler" }
nofy-telemetry = { workspace = true }
nofy-version = { workspace = true }
nofy-workspace = { workspace = true }

[lints]
workspace = true
