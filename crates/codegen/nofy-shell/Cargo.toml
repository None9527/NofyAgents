[package]
license = "Apache-2.0"
name = "nofy-shell"
version = "0.2.121"
edition.workspace = true

[features]
default = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`.
test-support = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
default-bazel = [
    "local-workspace",
    "test-support",
]

[dependencies]
nofy-env = { workspace = true }
dunce = { workspace = true }
tonic-prost = { workspace = true, optional = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
nofy-announcements = { workspace = true }
nofy-prompt-queue = { workspace = true }
nofy-runtimecore = { workspace = true }
nofy-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `nofy-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `nofy_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of nofy-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
nofy-mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Bumped from 0.32 to resolve CVE-2025-29087, CVE-2025-3277, CVE-2025-6965.
# sqlite-vec is C ABI, not Rust-version dependent — any rusqlite with `bundled` works.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
similar = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dirs = "6"
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
nofy-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = { workspace = true }
rand = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true }
nofy-fast-worktree = { path = "../nofy-fast-worktree", features = ["metadata"] }

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
nofy-paths = { path = "../nofy-paths" }
nofy-shell-base = { workspace = true }
nofy-shell-session-support = { workspace = true }
nofy-shared = { workspace = true }
nofy-tracing-macros = { path = "../nofy-tracing-macros" }
nofy-fsnotify = { path = "../nofy-fsnotify" }
nofy-codebase-graph = { path = "../nofy-codebase-graph" }
nofy-hunk-tracker = { path = "../nofy-hunk-tracker" }
nofy-agent-lifecycle = { workspace = true }
nofy-interjection-core = { workspace = true }
nofy-sandbox = { path = "../nofy-sandbox", default-features = false }
nofy-chat-state = { path = "../nofy-chat-state" }
nofy-convergence = { workspace = true }
nofy-gix-status = { workspace = true }
gix = { workspace = true, features = ["status", "parallel"] }
nofy-compaction = { path = "../../common/nofy-compaction" }
nofy-extra-ca = { workspace = true }
nofy-sampler = { path = "../nofy-sampler" }
nofy-sqlite-journal = { workspace = true }
nofy-session-journal = { workspace = true }
nofy-control-schema = { workspace = true }
nofy-daemon = { workspace = true }
nofy-channel = { workspace = true }
nofy-token-estimation = { workspace = true }
nofy-sampling-types = { path = "../nofy-sampling-types" }
nofy-tools = { path = "../nofy-tools" }
nofy-tty-utils = { workspace = true }
nofy-workflow = { path = "../nofy-workflow" }
nofy-system-power = { workspace = true }
nofy-workspace = { workspace = true }
nofy-subagent-resolution = { path = "../nofy-subagent-resolution" }
nofy-agent = { path = "../nofy-agent" }
nofy-config = { workspace = true }
nofy-config-types = { workspace = true }
nofy-memory = { workspace = true }
nofy-hooks = { path = "../nofy-hooks" }
nofy-hooks-plugins-types = { path = "../nofy-hooks-plugins-types" }
nofy-plugin-marketplace = { path = "../nofy-plugin-marketplace" }
nofy-file-utils = { path = "../nofy-file-utils" }
nofy-auth = { workspace = true, features = ["middleware"] }
nofy-telemetry = { workspace = true }
nofy-http = { workspace = true }
nofy-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
process-wrap = { version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"] }
portable-pty = "0.9"
parking_lot.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# nofy_tool_runtime::Tool dispatch model.
nofy-tool-runtime = { workspace = true }
nofy-tool-protocol = { workspace = true }
nofy-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
nofy-memory = { workspace = true, features = ["test-support"] }
nofy-workspace = { workspace = true, features = ["test-support"] }
nofy-config = { workspace = true, features = [] }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
nofy-shell-base = { workspace = true, features = ["test-support"] }
nofy-test-support = { workspace = true, features = [] }
nofy-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[test]]
name = "test_session_load_memory"
required-features = ["test-support"]

[[test]]
name = "test_fork_copy_memory"
required-features = ["test-support"]

[[test]]
name = "session_fork_replay_memory"
required-features = ["test-support"]

[[test]]
name = "session_load_perf"
required-features = ["test-support"]

[[test]]
name = "testkit_synth_roundtrip"
required-features = ["test-support"]

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
