[package]
license = "Apache-2.0"
name = "nofy-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
nofy-goal = { path = "../../common/nofy-goal", optional = true }
parking_lot = { workspace = true, optional = true }
nofy-compaction = { path = "../../common/nofy-compaction", optional = true, features = ["agent-runtime"] }
nofy-agent-executors = { path = "../../common/nofy-agent-executors", optional = true, features = ["nofy-sandbox"] }
async-trait = { workspace = true }
futures = { workspace = true }
nofy-agent-runtime = { path = "../../common/nofy-agent-runtime" }
nofy-tool-runtime = { path = "../../common/nofy-tool-runtime" }
nofy-tool-protocol = { path = "../../common/nofy-tool-protocol" }
dunce = { workspace = true }
nofy-hooks = { path = "../nofy-hooks" }
nofy-tools = { path = "../nofy-tools" }
nofy-tty-utils = { workspace = true }
nofy-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax", "fuel"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
dirs = "6"
nofy-config = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
nofy-tool-types.workspace = true

[features]
goal = ["dep:nofy-goal", "dep:parking_lot"]
context = ["dep:nofy-compaction"]
executors = ["dep:nofy-agent-executors"]
default = []
default-bazel = []

[dev-dependencies]
nofy-agent-runtime = { path = "../../common/nofy-agent-runtime", features = ["sqlite"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
