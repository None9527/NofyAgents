# link-arg
# https://pyo3.rs/v0.17.1/building_and_distribution.html#macos

# force-unwind-tables
# https://github.com/rust-lang/backtrace-rs/issues/397

# rustflags are not additive. we have differing flags per arch,
# so we must repeat flags in each target section

[target.x86_64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-undefined",
    "-C",
    "link-arg=dynamic_lookup",
    "-C",
    "force-unwind-tables=yes",
    "-C",
    "link-args=-ObjC",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-undefined",
    "-C",
    "link-arg=dynamic_lookup",
    "-C",
    "force-unwind-tables=yes",
    "-C",
    "link-args=-ObjC",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "force-unwind-tables=yes"]

# `generic`, not a specific core: a distributed binary must run on every aarch64
# machine of this target (Neoverse V2 code faults with SIGILL on older cores).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic", "-C", "force-unwind-tables=yes"]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "force-unwind-tables=yes",
    # Binary hardening (SECURITY): Full RELRO + non-executable stack
    # These flags prevent: GOT overwrite attacks, lazy binding exploits, stack shellcode
    # IMPORTANT: If changing build system (e.g. from cargo to Bazel-only),
    # ensure equivalent linker hardening is applied to production binaries.
    "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-cpu=generic",
    "-C", "force-unwind-tables=yes",
    # Binary hardening (SECURITY): Full RELRO + non-executable stack
    # These flags prevent: GOT overwrite attacks, lazy binding exploits, stack shellcode
    # IMPORTANT: If changing build system (e.g. from cargo to Bazel-only),
    # ensure equivalent linker hardening is applied to production binaries.
    "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "force-unwind-tables=yes", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "force-unwind-tables=yes", "-C", "target-feature=+crt-static"]


[env]
# SessionActor turn futures overflow libtest's default 2MB test-thread stack
# in debug builds (see disk_full_tests::block_on_session and the 8MB
# SESSION_THREAD_STACK_SIZE production session thread). Raise the floor for
# cargo-spawned test threads so `cargo test` does not abort mid-suite.
RUST_MIN_STACK = "16777216"
