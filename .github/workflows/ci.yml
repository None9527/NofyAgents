name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: release gate (fmt, check, tests, boundaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and components.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged user namespaces
        # The sandbox builds user, pid, mount and network namespaces. Ubuntu 24.04
        # restricts that with AppArmor, so without this its tests fail with
        # "required process-tree bootstrap failed: Permission denied".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Release checks
        run: bash scripts/check-release.sh

  # A bounded native gate for the process adapter, independent of unfinished
  # whole-workspace portability. All OSes run the same features and tests; no
  # capability skips or allowed failures can turn missing CPU accounting green.
  process-accounting:
    name: process CPU accounting on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify native CPU units and overflow handling
        run: cargo test --locked -p nofy-tty-utils --all-features --lib process_cpu::tests
      - name: Verify owned-child accounting natively
        run: cargo test --locked -p nofy-tty-utils --all-features --test process_cpu

  # Shared declaration/catalog checks must run natively, even where execution
  # is intentionally refused. Keep legacy descriptors and error envelopes.
  factory-catalog:
    name: process factory catalog on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure skip report
        run: |
          report="$RUNNER_TEMP/nofy-factory-skips.log"
          : > "$report"
          test -w "$report"
          echo "NOFY_SKIP_REPORT=$report" >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Record the native acceptance test inventory
        run: |
          for filter in loader::factories::catalog_tests process_policy loader::factories::unavailable loader::directories::tests loader::runtime_history::protection::tests; do
            echo "=== $filter ==="
            cargo test --locked -p nofy-agent-host --all-features --lib "$filter" -- --list
          done | tee "$RUNNER_TEMP/nofy-factory-test-list.txt"
      - name: Verify shared catalog and public activation boundary
        run: cargo test --locked -p nofy-agent-host --all-features --lib loader::factories::catalog_tests
      - name: Verify portable policy and compatibility identities
        run: cargo test --locked -p nofy-agent-host --all-features --lib process_policy
      - name: Verify no missing-backend execution fallback
        run: cargo test --locked -p nofy-agent-host --all-features --lib loader::factories::unavailable
      - name: Verify native directory declaration and authority boundary
        run: cargo test --locked -p nofy-agent-host --all-features --lib loader::directories::tests
      - name: Verify external runtime history remains private
        run: cargo test --locked -p nofy-agent-host --all-features --lib loader::runtime_history::protection::tests
      - name: Verify native runtime history preflight and transfer regressions
        run: |
          set -euo pipefail
          filters=(
            loader::runtime_history::transfer::preflight_tests
            loader::runtime_history::tests::cached_stores_follow_real_generations_and_reverse_copies_latest_history
            loader::runtime_history::tests::recover_each_durable_cut_by_original_command_after_real_process_exit
            loader::runtime_history::tests::abort_releases_exact_retirement_and_preserves_partial_copies
            loader::runtime_history::tests::missing_authority_pointer_or_active_database_never_reopens_old_history
            loader::runtime_history::tests::incomplete_unpublished_drafts_do_not_grant_authority_or_block_history_transfer
          )
          for filter in "${filters[@]}"; do
            inventory="$RUNNER_TEMP/nofy-history-inventory.txt"
            result="$RUNNER_TEMP/nofy-history-result.txt"
            cargo test --locked -p nofy-agent-host --all-features --lib "$filter" -- --list | tee "$inventory"
            grep -Eq ': test$' "$inventory"
            cat "$inventory" >> "$RUNNER_TEMP/nofy-factory-test-list.txt"
            cargo test --locked -p nofy-agent-host --all-features --lib "$filter" | tee "$result"
            grep -Eq '^test result: ok[.] [1-9][0-9]* passed; 0 failed; 0 ignored;' "$result"
            if grep -Eq '^test result:.*[1-9][0-9]* ignored;' "$result"; then
              exit 1
            fi
          done
      - name: Reject skipped acceptance checks
        if: always()
        run: |
          test -f "$NOFY_SKIP_REPORT"
          if [ -s "$NOFY_SKIP_REPORT" ]; then
            cat "$NOFY_SKIP_REPORT"
            exit 1
          fi

      - name: Retain native test inventory and skip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-acceptance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nofy-factory-test-list.txt
            ${{ runner.temp }}/nofy-factory-skips.log
          if-no-files-found: error

  # Five portable runtime targets, not the runtime crate's Unix-only suites.
  # Native execution plus an actual inventory comparison are both required.
  shared-kernel:
    name: shared kernel contracts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the evidence checker, including rejected evidence
        run: python -m unittest discover -s scripts -p test_verify_shared_kernel.py
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Collect and verify native shared-kernel inventory and results
        run: python scripts/verify-shared-kernel.py collect "$RUNNER_TEMP/nofy-shared-kernel" --runner "${{ matrix.os }}"
      - name: Test the independent-consumer runner
        run: python -m unittest discover -s scripts/tests -p test_verify_agent_independent_consumer.py
      - name: Verify the runtime as an independent offline consumer
        run: python scripts/verify-agent-independent-consumer.py --output "$RUNNER_TEMP/nofy-independent-consumer"
      - name: Retain independent-consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-consumer-${{ matrix.os }}
          path: ${{ runner.temp }}/nofy-independent-consumer/
          if-no-files-found: error
      - name: Retain native inventory, results, exit codes, and skip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-kernel-${{ matrix.os }}
          path: ${{ runner.temp }}/nofy-shared-kernel/
          if-no-files-found: error

  shared-kernel-parity:
    name: shared kernel actual inventory parity
    needs: shared-kernel
    # A failed matrix member must produce a failed comparison, not a skipped gate.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-kernel-*
          path: ${{ runner.temp }}/nofy-shared-kernel-platforms
      - name: Require all three successful native inventories to match
        run: python scripts/verify-shared-kernel.py compare "$RUNNER_TEMP/nofy-shared-kernel-platforms"

  clippy:
    name: clippy (warnings are errors)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # The two jobs below turn claims into checks: rust-toolchain.toml declares
  # aarch64, and the workspace has hundreds of tests the release gate does not
  # select. Neither job has run on a hosted runner yet (the author's machine has
  # no cross toolchain and no sudo), so treat them as informational: do not make
  # them required checks until each has been green once.
  aarch64-check:
    name: aarch64 type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Dependencies with C build scripts (ring, aws-lc-sys, sqlite, blake3, zlib)
      # need a cross C compiler even for `cargo check`.
      - name: Install cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: >
          cargo check --locked --workspace --all-targets --all-features
          --target aarch64-unknown-linux-gnu

  workspace-tests:
    name: workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged user namespaces
        # The sandbox builds user, pid, mount and network namespaces. Ubuntu 24.04
        # restricts that with AppArmor, so without this its tests fail with
        # "required process-tree bootstrap failed: Permission denied".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        # The sandbox acceptance tests need a systemd user manager with cgroup
        # delegation. Where the runner has none, skip exactly those and say so.
        run: |
          skip=()
          if ! systemd-run --user --scope -p Delegate=yes true >/dev/null 2>&1; then
            echo "::warning title=Sandbox acceptance skipped::no cgroup delegation on this runner"
            skip=(--skip confined:: --skip real_namespace_lifecycle)
          fi
          # Most host integration tests start real kernels and wait on them with fixed
          # timeouts. On a 4-core runner, running as many at once as there are cores made
          # them 3x slower than on a 16-core machine (the http binary: 37 min against 12)
          # and seven of them timed out, so the host suites run two at a time.
          status=0
          # nofy-cli's integration tests run the real kernel helper, a binary of the
          # host package that is tested last. Build it first: a cached target used to
          # hide that, and a new lock file (a new cache key) exposed it.
          cargo build --locked -p nofy-agent-host --all-features || status=1
          cargo test --locked --workspace --exclude nofy-agent-host --all-features --no-fail-fast -- "${skip[@]}" || status=1
          cargo test --locked -p nofy-agent-host --all-features --no-fail-fast -- --test-threads=2 "${skip[@]}" || status=1
          exit $status

  # The kernel is meant to behave the same on every platform: its protocol, the
  # state it commits and the digests it computes must not depend on the operating
  # system. What differs today is confinement: the sandbox backend (Landlock,
  # cgroups, seccomp, namespaces) exists only on Linux, so the kernel's own
  # workers and process tools are refused elsewhere until the macOS and Windows
  # backends land (docs/architecture/sandbox-module.md). The measuring jobs below
  # run the whole workspace on both platforms; scripts/verify-platform-welds.py
  # keeps the Linux-only assumptions from growing. This job builds and tests the
  # parts that only talk to a kernel over HTTP and edit local files: the command
  # line, the MCP bridge, the client and the project engine. nofy-cli's
  # integration tests start a kernel, so only its binary is built; the other
  # three crates are tested.
  client-portability:
    name: client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the nofy command line
        run: cargo build --locked -p nofy-cli
      - name: Test the portable crates
        run: cargo test --locked --no-fail-fast -p nofy-agent-project -p nofy-agent-client -p nofy-agent-mcp -p nofy-isolation -p nofy-durable-fs -p nofy-private-fs -p nofy-host-path
      # Needs the command line only, not a kernel: the same source directory must
      # collect to the same package on every platform.
      - name: Test the command line without a kernel
        run: cargo test --locked -p nofy-cli --test executables

  # Measurement, not a gate: how far the whole workspace gets on each platform.
  # The kernel's isolation backend exists only on Linux today
  # (docs/architecture/sandbox-module.md), so this is expected to fail until the
  # macOS and Windows backends exist; its value is the per-crate
  # error list in the job summary. Turn continue-on-error off once it is green.
  workspace-portability:
    name: whole workspace on ${{ matrix.os }} (measuring)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check every crate, keep going after failures
        run: cargo check --locked --workspace --keep-going --message-format short 2>&1 | tee check.log
      - name: Summarize which crates fail
        if: always()
        run: |
          {
            echo "### crates that do not compile on ${{ matrix.os }}"
            echo '```'
            grep -E "^error: could not compile" check.log | sort | uniq -c || echo "none"
            echo '```'
            echo "errors: $(grep -cE '^[^ ]+:[0-9]+:[0-9]+: error' check.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Measurement, not a gate: every test of the workspace, natively, in one run, so a
  # platform's whole list of failures arrives at once instead of one per push.
  # Tests that need Linux isolation are compiled out by cfg and do not appear; what
  # remains failing is either a portability bug or an assumption to name in
  # docs/architecture/platforms.md. Turn continue-on-error off once it is green.
  workspace-tests-portability:
    name: whole workspace tests on ${{ matrix.os }} (measuring)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the binaries the integration tests start
        run: cargo build --locked --workspace --bins
      - name: Run every test, keep going after failures
        run: cargo test --locked --workspace --no-fail-fast -- --test-threads=2 2>&1 | tee tests.log
      - name: List what failed
        if: always()
        run: |
          {
            echo "### failing tests on ${{ matrix.os }}"
            echo '```'
            grep -E "^test .* \.\.\. FAILED$" tests.log | sort | uniq || echo "none"
            echo '```'
            echo "test binaries that failed:"
            echo '```'
            grep -E "^error: test failed|^error: [0-9]+ targets? failed|^    \`-p " tests.log | sort | uniq || echo "none"
            echo '```'
            echo "passed: $(grep -E '^test .* \.\.\. ok$' tests.log | wc -l)  failed: $(grep -cE '^test .* \.\.\. FAILED$' tests.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Does a real kernel start and serve the control plane? Linux is the baseline and
  # must pass. On macOS and Windows the whole workspace type-checks, but whether the
  # kernel runs there is exactly what this measures, so those two may fail for now.
  kernel-smoke:
    name: kernel control plane on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the kernel and the command line
        run: cargo build --locked -p nofy-agent-host -p nofy-cli
      - name: Start a kernel and drive it
        run: bash scripts/smoke-kernel.sh
