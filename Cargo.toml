# Declarative agent framework workspace.

[workspace]
resolver = "2"
default-members = ["crates/common/nofy-agent-host"]
members = [
    "crates/common/nofy-agent-executors",
    "crates/common/nofy-agent-host",
    "crates/common/nofy-agent-project",
    "crates/common/nofy-agent-client",
    "crates/common/nofy-agent-mcp",
    "crates/common/nofy-cli",
    "crates/common/nofy-agent-models",
    "crates/common/nofy-agent-modules",
    "crates/common/nofy-agent-runtime",
    "crates/common/nofy-host-path",
    "crates/common/nofy-durable-fs",
    "crates/common/nofy-isolation",
    "crates/common/nofy-memory",
    "crates/common/nofy-memory-types",
    "crates/common/nofy-private-fs",
    "crates/common/nofy-sqlite-journal",
    "crates/common/nofy-test-support",
    "crates/common/nofy-tool-protocol",
    "crates/common/nofy-tool-runtime",
    "crates/common/nofy-tool-types",
    "crates/common/nofy-tty-utils",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dunce = "1"
filetime = "0.2.25"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
jsonschema = "0.30.0"
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal"] }
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json", "http2", "socks"], default-features = false }
rhai = { version = "1.25", features = ["serde"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["force-soft"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
windows = { version = "0.61", features = ["Win32_Security", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects"] }
nofy-durable-fs = { path = "crates/common/nofy-durable-fs" }
nofy-host-path = { path = "crates/common/nofy-host-path" }
nofy-private-fs = { path = "crates/common/nofy-private-fs" }
nofy-test-support = { path = "crates/common/nofy-test-support" }
nofy-sqlite-journal = { path = "crates/common/nofy-sqlite-journal" }
nofy-tool-protocol = { path = "crates/common/nofy-tool-protocol" }
nofy-tool-types = { path = "crates/common/nofy-tool-types" }
nofy-tty-utils = { path = "crates/common/nofy-tty-utils" }

# Fail-stop policy: a panic aborts the whole process instead of unwinding.
# The kernel keeps durable checkpoints, leases and budget ledgers, and recovers
# from them on restart, so a crash is safe; unwinding would instead leave
# poisoned std locks behind (many `lock().expect(..)` sites) and half-applied
# in-memory state. Consequence: `catch_unwind` has no effect in release/dev
# builds (see runtime `tasks.rs`), so code on untrusted-input paths must return
# errors, never panic.
[profile.release]
incremental = true
panic = "abort"

[profile.dev]
panic = "abort"
split-debuginfo = "unpacked"
codegen-units = 128
debug = "line-tables-only"
opt-level = 0
lto = false
incremental = true

[profile.bench]
debug = true

[workspace.lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
needless_lifetimes = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
useless_format = "allow"
