# Workspace clippy configuration (clippy reads the nearest clippy.toml only).

# nofy_agent_runtime::Error is larger than clippy's default 128-byte limit, so
# every `Result<_, Error>` would trip `result_large_err`. 256 is a deliberate
# ceiling: raise it only with a reason, or box the error to shrink it.
large-error-threshold = 256

# Ban raw child-process spawning: a child nobody owns outlives the work that
# started it. Every spawn site must carry
# `#[allow(clippy::disallowed_methods)] // <who reaps/kills the child>` naming
# the owner that waits on, kills, or deliberately detaches it. This keeps the
# set of process-creating sites reviewable.
#
# `canonicalize` is intentionally not banned: the workspace targets Linux only
# (see rust-toolchain.toml), where `std::fs::canonicalize` and
# `dunce::canonicalize` are identical. Re-add that rule if a Windows target is
# ever introduced.
disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "annotate the owner that reaps or kills this child, or enroll it via nofy_tty_utils::ProcessScope" },
    { path = "tokio::process::Command::spawn", reason = "annotate the owner that reaps or kills this child, or enroll it via nofy_tty_utils::ProcessScope" },
]
